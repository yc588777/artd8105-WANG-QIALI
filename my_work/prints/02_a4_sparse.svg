  <title>ARTD8105 instruction drawing</title>
  <desc>Parallel wavy lines of different colors going from left to right, located at the top part of the page. A triangle, a rectangle and a circle of different colors located slightly above the center of the page. All shapes are overlapping. An array of multiple lines, evenly spaced, extending from the lowest point of the circle to the bottom edge of the page. The lines are evenly spaced. The first line touches the bottom left corner of the page and the last line touches the bottom right corner of the page. At the bottom of the page, a single row of circles is drawn where each circle is between two lines.</desc>
