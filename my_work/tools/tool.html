<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ARTD8105 — instruction generator</title>
  <style>
    :root {
      --ink: #1c1b19;
      --muted: #5c5852;
      --line: #d8d3c8;
      --panel: #f7f4ee;
      --paper: #fff;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: #e8e4db;
      display: flex;
    }
    aside {
      width: 360px;
      min-width: 360px;
      height: 100%;
      overflow: auto;
      background: var(--panel);
      border-right: 1px solid var(--line);
      padding: 20px 18px 40px;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow: auto;
    }
    h1 { font-size: 16px; font-weight: 650; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 12px; margin: 0 0 16px; }
    .instruction {
      font-size: 12px;
      color: var(--muted);
      border: 1px solid var(--line);
      padding: 10px 12px;
      margin-bottom: 16px;
      background: var(--paper);
    }
    fieldset {
      border: 1px solid var(--line);
      margin: 0 0 12px;
      padding: 10px 12px 12px;
      background: var(--paper);
    }
    legend { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); padding: 0 4px; }
    label.row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 6px 10px;
      align-items: center;
      margin: 8px 0;
      font-size: 13px;
    }
    label.row input[type="range"] { grid-column: 1 / -1; width: 100%; }
    label.row .val { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
    select, input[type="number"] {
      width: 100%;
      font: inherit;
      padding: 4px 6px;
      border: 1px solid var(--line);
      background: #fff;
    }
    .row-seed {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px;
      margin: 8px 0 10px;
    }
    button {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: #fff;
      cursor: pointer;
    }
    button.ghost {
      background: transparent;
      color: var(--ink);
    }
    .actions { display: grid; gap: 6px; margin: 10px 0 14px; }
    #valueSheet {
      font: 11px/1.4 ui-monospace, Consolas, monospace;
      white-space: pre-wrap;
      background: var(--paper);
      border: 1px solid var(--line);
      padding: 10px;
      color: var(--muted);
    }
    svg#art {
      height: min(90vh, 920px);
      width: auto;
      max-width: 100%;
      background: #fff;
      box-shadow: none;
      border: 1px solid #cfcabe;
    }
  </style>
</head>
<body>
  <aside>
    <h1>Instruction generator</h1>
    <p class="sub">ARTD8105 · WANG QIALI · Session 2 · ISO portrait A2</p>
    <div class="instruction" id="instructionText"></div>

    <div class="actions">
      <div class="row-seed">
        <input id="seed" type="number" min="1" step="1" value="1" aria-label="Seed" />
        <button type="button" class="ghost" id="seedNew">New seed</button>
        <button type="button" id="download">Download SVG</button>
      </div>
    </div>

    <fieldset>
      <legend>Wavy lines — “parallel wavy lines”</legend>
      <label class="row">Wave count <span class="val" data-for="waveCount"></span>
        <input id="waveCount" type="range" min="3" max="12" step="1" value="7" />
      </label>
      <label class="row">Amplitude (% page height) <span class="val" data-for="waveAmplitude"></span>
        <input id="waveAmplitude" type="range" min="0.5" max="4" step="0.1" value="2" />
      </label>
      <label class="row">Cycles across page <span class="val" data-for="waveCycles"></span>
        <input id="waveCycles" type="range" min="2" max="8" step="1" value="4" />
      </label>
      <label class="row">Band lower edge (% height) <span class="val" data-for="waveBand"></span>
        <input id="waveBand" type="range" min="5" max="25" step="0.5" value="15" />
      </label>
    </fieldset>

    <fieldset>
      <legend>Three shapes — “slightly above the center”</legend>
      <label class="row">Group X (% width) <span class="val" data-for="groupX"></span>
        <input id="groupX" type="range" min="40" max="60" step="0.5" value="50" />
      </label>
      <label class="row">Group Y (% height) <span class="val" data-for="groupY"></span>
        <input id="groupY" type="range" min="35" max="48" step="0.5" value="42" />
      </label>
      <label class="row">Circle size (% width) <span class="val" data-for="circleSize"></span>
        <input id="circleSize" type="range" min="14" max="26" step="0.5" value="20" />
      </label>
      <label class="row">Rectangle vs circle (%) <span class="val" data-for="rectRel"></span>
        <input id="rectRel" type="range" min="72" max="95" step="1" value="84" />
      </label>
      <label class="row">Triangle vs circle (%) <span class="val" data-for="triRel"></span>
        <input id="triRel" type="range" min="55" max="82" step="1" value="66" />
      </label>
      <label class="row">Rectangle aspect (width:height) <span class="val" data-for="rectAspect"></span>
        <input id="rectAspect" type="range" min="1" max="2" step="0.05" value="1.5" />
      </label>
      <label class="row">Triangle rotation (degrees) <span class="val" data-for="triRot"></span>
        <input id="triRot" type="range" min="-45" max="45" step="1" value="0" />
      </label>
      <label class="row">Overlap (% of smaller) <span class="val" data-for="overlap"></span>
        <input id="overlap" type="range" min="15" max="45" step="1" value="30" />
      </label>
    </fieldset>

    <fieldset>
      <legend>Fan — “from the lowest point of the circle”</legend>
      <label class="row">Fan line count <span class="val" data-for="fanCount"></span>
        <input id="fanCount" type="range" min="5" max="13" step="1" value="9" />
      </label>
      <label class="row">Spacing
        <select id="fanSpacing">
          <option value="bottom" selected>Even along bottom edge (fixed rule)</option>
          <option value="angle">Even by angle</option>
        </select>
      </label>
      <label class="row">Bottom-row height (% height) <span class="val" data-for="rowY"></span>
        <input id="rowY" type="range" min="88" max="96" step="0.5" value="92" />
      </label>
      <label class="row">Bottom-circle diameter (% width) <span class="val" data-for="dotSize"></span>
        <input id="dotSize" type="range" min="3" max="7" step="0.1" value="5" />
      </label>
    </fieldset>

    <fieldset>
      <legend>Marks — colour and weight</legend>
      <label class="row">Line weight (preview 1–6) <span class="val" data-for="lineWeight"></span>
        <input id="lineWeight" type="range" min="1" max="6" step="1" value="3" />
      </label>
      <label class="row">Triangle hue <span class="val" data-for="hueTri"></span>
        <input id="hueTri" type="range" min="0" max="360" step="1" value="8" />
      </label>
      <label class="row">Rectangle hue <span class="val" data-for="hueRect"></span>
        <input id="hueRect" type="range" min="0" max="360" step="1" value="46" />
      </label>
      <label class="row">Circle hue <span class="val" data-for="hueCirc"></span>
        <input id="hueCirc" type="range" min="0" max="360" step="1" value="214" />
      </label>
      <label class="row">Shape saturation (%) <span class="val" data-for="shapeSat"></span>
        <input id="shapeSat" type="range" min="40" max="80" step="1" value="58" />
      </label>
      <label class="row">Shape lightness (%) <span class="val" data-for="shapeLit"></span>
        <input id="shapeLit" type="range" min="35" max="75" step="1" value="50" />
      </label>
      <label class="row">Wave saturation (%) <span class="val" data-for="waveSat"></span>
        <input id="waveSat" type="range" min="40" max="80" step="1" value="58" />
      </label>
      <label class="row">Wave lightness (%) <span class="val" data-for="waveLit"></span>
        <input id="waveLit" type="range" min="35" max="75" step="1" value="48" />
      </label>
      <label class="row">Bottom-circle hue <span class="val" data-for="hueDots"></span>
        <input id="hueDots" type="range" min="0" max="360" step="1" value="0" />
      </label>
      <label class="row">Bottom-circle saturation (%) <span class="val" data-for="dotSat"></span>
        <input id="dotSat" type="range" min="0" max="80" step="1" value="0" />
      </label>
    </fieldset>

    <p class="sub">Values at export — copy onto the wall label</p>
    <div id="valueSheet"></div>
  </aside>

  <main>
    <svg id="art" width="420mm" height="594mm" viewBox="0 0 420 594" xmlns="http://www.w3.org/2000/svg"></svg>
  </main>

  <script>
    const PAGE_W = 420;
    const PAGE_H = 594;
    const CHARCOAL = "#2a2a28";
    const PAPER = "#f3f0e8";

    const INSTRUCTION = [
      "Parallel wavy lines of different colors going from left to right, located at the top part of the page.",
      "A triangle, a rectangle and a circle of different colors located slightly above the center of the page. All shapes are overlapping.",
      "An array of multiple lines, evenly spaced, extending from the lowest point of the circle to the bottom edge of the page. The lines are evenly spaced. The first line touches the bottom left corner of the page and the last line touches the bottom right corner of the page. At the bottom of the page, a single row of circles is drawn where each circle is between two lines."
    ].join(" ");

    document.getElementById("instructionText").textContent = INSTRUCTION;

    const ids = [
      "seed", "waveCount", "waveAmplitude", "waveCycles", "waveBand",
      "groupX", "groupY", "circleSize", "rectRel", "triRel", "rectAspect",
      "triRot", "overlap", "fanCount", "fanSpacing", "rowY", "dotSize",
      "lineWeight", "hueTri", "hueRect", "hueCirc", "shapeSat", "shapeLit",
      "waveSat", "waveLit", "hueDots", "dotSat"
    ];

    function $(id) { return document.getElementById(id); }

    function num(id) { return Number($(id).value); }

    // Same seed always gives the same drawing.
    function mulberry32(seed) {
      let a = seed >>> 0;
      return function () {
        a |= 0;
        a = (a + 0x6d2b79f5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function hsl(h, s, l) {
      return `hsl(${h} ${s}% ${l}%)`;
    }

    function fmt(id) {
      const el = $(id);
      const span = document.querySelector(`[data-for="${id}"]`);
      if (!span) return;
      const v = el.value;
      if (id === "rectAspect") span.textContent = Number(v).toFixed(2) + ":1";
      else if (["waveAmplitude", "waveBand", "groupX", "groupY", "circleSize", "rowY", "dotSize"].includes(id))
        span.textContent = Number(v).toFixed(1);
      else span.textContent = v;
    }

    function trianglePoints(cx, cy, side, rotationDeg) {
      // "a triangle" → equilateral; 0° points up (SVG y grows down)
      const r = side / Math.sqrt(3);
      const rot = (rotationDeg - 90) * Math.PI / 180;
      const pts = [];
      for (let i = 0; i < 3; i++) {
        const a = rot + i * (2 * Math.PI / 3);
        pts.push([cx + r * Math.cos(a), cy + r * Math.sin(a)]);
      }
      return pts;
    }

    function polyString(pts) {
      return pts.map((p) => p[0].toFixed(3) + "," + p[1].toFixed(3)).join(" ");
    }

    function wavePath(y, amp, cycles, phase) {
      // "wavy" → sine; "going from left to right" → full width
      const steps = 240;
      let d = `M 0 ${y.toFixed(3)}`;
      for (let i = 1; i <= steps; i++) {
        const x = (i / steps) * PAGE_W;
        const yy = y + amp * Math.sin(cycles * 2 * Math.PI * (x / PAGE_W) + phase);
        d += ` L ${x.toFixed(3)} ${yy.toFixed(3)}`;
      }
      return d;
    }

    function hitBottom(ox, oy, x2, y2, rowY) {
      const t = (rowY - oy) / (y2 - oy);
      return ox + t * (x2 - ox);
    }

    function readParams() {
      const seed = Math.max(1, Math.floor(num("seed")) || 1);
      const rand = mulberry32(seed);
      return {
        seed,
        waveCount: Math.round(num("waveCount")),
        waveAmplitude: num("waveAmplitude"),
        waveCycles: Math.round(num("waveCycles")),
        waveBand: num("waveBand"),
        groupX: num("groupX"),
        groupY: num("groupY"),
        circleSize: num("circleSize"),
        rectRel: num("rectRel"),
        triRel: num("triRel"),
        rectAspect: num("rectAspect"),
        triRot: num("triRot"),
        overlap: num("overlap"),
        fanCount: Math.round(num("fanCount")),
        fanSpacing: $("fanSpacing").value,
        rowY: num("rowY"),
        dotSize: num("dotSize"),
        lineWeight: Math.round(num("lineWeight")),
        hueTri: num("hueTri"),
        hueRect: num("hueRect"),
        hueCirc: num("hueCirc"),
        shapeSat: num("shapeSat"),
        shapeLit: num("shapeLit"),
        waveSat: num("waveSat"),
        waveLit: num("waveLit"),
        hueDots: num("hueDots"),
        dotSat: num("dotSat"),
        wavePhase: rand() * Math.PI * 2,
        waveHueStart: rand() * 360
      };
    }

    function draw() {
      ids.forEach(fmt);
      const p = readParams();
      const strokeMm = p.lineWeight * 0.3;

      const gx = PAGE_W * p.groupX / 100;
      const gy = PAGE_H * p.groupY / 100;
      const circleD = PAGE_W * p.circleSize / 100;
      const circleR = circleD / 2;

      const rectW = circleD * p.rectRel / 100;
      const rectH = rectW / p.rectAspect;
      const triSide = circleD * p.triRel / 100;

      // overlap: 15–45% of the smaller shape → how far centres sit from the shared point
      const t = 1 - p.overlap / 100;
      const rectCx = gx - t * (rectW / 2) * 0.82;
      const rectCy = gy - t * (rectH / 2) * 0.35;
      const triCx = gx + t * (triSide / 2) * 0.82;
      const triCy = gy - t * (triSide / 2) * 0.35;
      const triPts = trianglePoints(triCx, triCy, triSide, p.triRot);

      const originX = gx;
      const originY = gy + circleR;
      const bandBottom = PAGE_H * p.waveBand / 100;
      const amp = PAGE_H * p.waveAmplitude / 100;
      const rowY = PAGE_H * p.rowY / 100;
      const dotR = (PAGE_W * p.dotSize / 100) / 2;

      const ends = [];
      for (let i = 0; i < p.fanCount; i++) {
        const u = p.fanCount === 1 ? 0 : i / (p.fanCount - 1);
        if (p.fanSpacing === "angle") {
          // "evenly spaced by angle"
          const aLeft = Math.atan2(PAGE_H - originY, 0 - originX);
          const aRight = Math.atan2(PAGE_H - originY, PAGE_W - originX);
          const a = aLeft + u * (aRight - aLeft);
          const tHit = (PAGE_H - originY) / Math.sin(a);
          ends.push([originX + tHit * Math.cos(a), PAGE_H]);
        } else {
          // "inner lines terminate at evenly spaced positions along the bottom edge"
          ends.push([u * PAGE_W, PAGE_H]);
        }
      }

      const wavePaths = [];
      for (let i = 0; i < p.waveCount; i++) {
        const y = (bandBottom / (p.waveCount + 1)) * (i + 1);
        const hue = (p.waveHueStart + i * (360 / p.waveCount)) % 360;
        wavePaths.push({
          d: wavePath(y, amp, p.waveCycles, p.wavePhase),
          stroke: hsl(hue, p.waveSat, p.waveLit)
        });
      }

      const fanLines = ends.map(([x2]) => ({
        x1: originX, y1: originY, x2, y2: PAGE_H
      }));

      const dots = [];
      for (let i = 0; i < p.fanCount - 1; i++) {
        const xA = hitBottom(originX, originY, ends[i][0], PAGE_H, rowY);
        const xB = hitBottom(originX, originY, ends[i + 1][0], PAGE_H, rowY);
        dots.push([(xA + xB) / 2, rowY]);
      }

      const fillTri = hsl(p.hueTri, p.shapeSat, p.shapeLit);
      const fillRect = hsl(p.hueRect, p.shapeSat, p.shapeLit);
      const fillCirc = hsl(p.hueCirc, p.shapeSat, p.shapeLit);
      const fillDot = p.dotSat < 1 ? CHARCOAL : hsl(p.hueDots, p.dotSat, p.shapeLit);

      const svg = $("art");
      svg.innerHTML = `
        <title>ARTD8105 instruction drawing</title>
        <desc>${INSTRUCTION.replace(/</g, "")}</desc>
        <defs>
          <clipPath id="pageClip">
            <rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}"/>
          </clipPath>
          <mask id="fanMask" maskUnits="userSpaceOnUse">
            <rect x="0" y="${originY.toFixed(3)}" width="${PAGE_W}" height="${(PAGE_H - originY).toFixed(3)}" fill="white"/>
            <polygon points="${polyString(triPts)}" fill="black"/>
            <rect x="${(rectCx - rectW / 2).toFixed(3)}" y="${(rectCy - rectH / 2).toFixed(3)}" width="${rectW.toFixed(3)}" height="${rectH.toFixed(3)}" fill="black"/>
          </mask>
        </defs>
        <g clip-path="url(#pageClip)">
          <rect x="0" y="0" width="${PAGE_W}" height="${PAGE_H}" fill="${PAPER}"/>
          ${wavePaths.map((w) => `<path d="${w.d}" fill="none" stroke="${w.stroke}" stroke-width="${strokeMm}" stroke-linecap="round"/>`).join("")}
          <polygon points="${polyString(triPts)}" fill="${fillTri}" stroke="${CHARCOAL}" stroke-width="${strokeMm * 0.7}"/>
          <rect x="${(rectCx - rectW / 2).toFixed(3)}" y="${(rectCy - rectH / 2).toFixed(3)}" width="${rectW.toFixed(3)}" height="${rectH.toFixed(3)}" fill="${fillRect}" stroke="${CHARCOAL}" stroke-width="${strokeMm * 0.7}"/>
          <circle cx="${gx.toFixed(3)}" cy="${gy.toFixed(3)}" r="${circleR.toFixed(3)}" fill="${fillCirc}" stroke="${CHARCOAL}" stroke-width="${strokeMm * 0.7}"/>
          <g mask="url(#fanMask)">
            ${fanLines.map((ln) => `<line x1="${ln.x1.toFixed(3)}" y1="${ln.y1.toFixed(3)}" x2="${ln.x2.toFixed(3)}" y2="${ln.y2.toFixed(3)}" stroke="${CHARCOAL}" stroke-width="${strokeMm}" stroke-linecap="butt"/>`).join("")}
          </g>
          ${dots.map(([x, y]) => `<circle cx="${x.toFixed(3)}" cy="${y.toFixed(3)}" r="${dotR.toFixed(3)}" fill="${fillDot}" stroke="${CHARCOAL}" stroke-width="${strokeMm * 0.55}"/>`).join("")}
        </g>
      `;

      $("valueSheet").textContent = [
        `instruction: version 2`,
        `seed: ${p.seed}`,
        `waveCount: ${p.waveCount}`,
        `waveAmplitude: ${p.waveAmplitude}% height`,
        `waveCycles: ${p.waveCycles}`,
        `waveBandLower: ${p.waveBand}% height`,
        `groupX: ${p.groupX}%  groupY: ${p.groupY}%`,
        `circleSize: ${p.circleSize}% width`,
        `rectRel: ${p.rectRel}%  triRel: ${p.triRel}%  aspect: ${p.rectAspect.toFixed(2)}:1`,
        `triRot: ${p.triRot}°  overlap: ${p.overlap}%`,
        `fanCount: ${p.fanCount}  fanSpacing: ${p.fanSpacing}`,
        `bottomRowY: ${p.rowY}%  bottomCircleDiameter: ${p.dotSize}%`,
        `lineWeight: ${p.lineWeight} (${strokeMm.toFixed(2)} mm)`,
        `hues T/R/C: ${p.hueTri}/${p.hueRect}/${p.hueCirc}  sat ${p.shapeSat}%  lit ${p.shapeLit}%`,
        `page: A2 420×594 mm portrait`
      ].join("\n");
    }

    ids.forEach((id) => $(id).addEventListener("input", draw));
    $("seedNew").addEventListener("click", () => {
      $("seed").value = String(1 + Math.floor(Math.random() * 9998));
      draw();
    });
    $("download").addEventListener("click", () => {
      const p = readParams();
      const svg = $("art").cloneNode(true);
      svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      svg.setAttribute("width", "420mm");
      svg.setAttribute("height", "594mm");
      const comment = document.createComment("\n" + $("valueSheet").textContent + "\n");
      svg.insertBefore(comment, svg.firstChild);
      const text = '<?xml version="1.0" encoding="UTF-8"?>\n' + svg.outerHTML;
      const blob = new Blob([text], { type: "image/svg+xml" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `wang-qiali_seed-${p.seed}_waves-${p.waveCount}_fan-${p.fanCount}.svg`;
      a.click();
      URL.revokeObjectURL(a.href);
    });

    draw();
  </script>
</body>
</html>
